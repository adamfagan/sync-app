spring:
  cloud:
    function:
      definition: syncPlayer;updatePlayer
  datasource:
    url: ${AZURE_SQL_CONNECTION_STRING}
    username: ${AZURE_SQL_USERNAME}
    password: ${AZURE_SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  data:
    redis:
      host: ${AZURE_REDIS_HOST}
      port: 6380
      password: ${AZURE_REDIS_KEY}
      ssl:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.cloud.function: DEBUG
    com.playersync: DEBUG
    com.microsoft.azure.functions: DEBUG